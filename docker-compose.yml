services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "${MONGODB_URI}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-fogpilot}"
      FOGPILOT_ALLOWED_ORIGINS: "${FOGPILOT_ALLOWED_ORIGINS:-http://localhost}"
      FOGPILOT_MAX_UPLOAD_BYTES: "${FOGPILOT_MAX_UPLOAD_BYTES:-209715200}"
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
